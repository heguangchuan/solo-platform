<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 1. 白环 halo（暗色底图上"抬"出来；色环宽 6 视觉单位，约 2.4px） -->
  <circle cx="50" cy="50" r="46" fill="#FFFFFF"/>
  <!-- 2. 状态色盘（在线=翠绿 #00E676，比 #00C853 略亮一档；保持高对比，蓝底上一眼可辨） -->
  <circle cx="50" cy="50" r="40" fill="#00E676"/>
  <!-- 3. 摄像头机身（白色圆角矩形，靠左） -->
  <rect x="20" y="38" width="40" height="24" rx="4" fill="#FFFFFF"/>
  <!-- 4. 镜头外壳（白色圆，从机身右侧伸出） -->
  <circle cx="64" cy="50" r="9" fill="#FFFFFF"/>
  <!-- 5. 镜头虹膜（状态色挖空，呈现"看穿"感） -->
  <circle cx="64" cy="50" r="5" fill="#00E676"/>
  <!-- 6. 镜头高光（小白点，3D 质感） -->
  <circle cx="62" cy="48" r="1.5" fill="#FFFFFF"/>
  <!-- 7. 底部支架（白色竖线） -->
  <line x1="44" y1="62" x2="44" y2="74" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- 8. 底座横杆（白色横线，cctv 标志性细节） -->
  <line x1="34" y1="74" x2="54" y2="74" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
