# ============================================================
#  solo 平台部署编排（被 Jenkinsfile 的 deploy 阶段 `docker compose up -d` 使用）
#
#  Jenkins deploy 阶段会先执行：
#    sed -i 's/solo:[0-9.]\+/solo:<version>/g' docker-compose.yml
#  把下面镜像的版本标签替换为本次构建的 version，再 compose up。
#
#  约定：mysql / redis / zlm(ZLMediaKit) / rustfs(S3) 作为外部服务存在
#       （独立部署，或与本文件合并到同一 docker 网络）。solo 通过服务名访问它们。
#  生产请将所有 CHANGE_ME 替换为真实值（建议用 .env 文件或编排平台的 secrets 管理）。
# ============================================================

services:
  solo:
    image: solo-platform/solo:1.0.0
    container_name: solo
    restart: unless-stopped
    ports:
      - "10003:10003"        # HTTP 管理面 / API
      - "15060:15060/tcp"    # GB28181 SIP 信令
      - "15060:15060/udp"    # GB28181 SIP 信令
    environment:
      SPRING_PROFILES_ACTIVE: "prod"

      # ---- 数据源 MySQL ----
      SOLO_DB_URL: "jdbc:mysql://mysql:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SOLO_DB_USERNAME: "root"
      SOLO_DB_PASSWORD: "CHANGE_ME"

      # ---- Redis ----
      SOLO_REDIS_HOST: "redis"
      SOLO_REDIS_PORT: "6379"
      SOLO_REDIS_PASSWORD: "CHANGE_ME"
      SOLO_REDIS_DB: "0"

      # ---- GB28181 信令 ----
      SOLO_SIP_IP: "0.0.0.0"
      SOLO_SIP_PUBLIC_IP: ""   # 公网/NAT 部署必填，设备可达地址
      SOLO_SIP_PORT: "15060"
      SOLO_SIP_ID: "60000000042000000028"
      SOLO_SIP_DOMAIN: "6000000004"
      SOLO_SIP_PASSWORD: "CHANGE_ME"

      # ---- JWT ----
      SOLO_JWT_SECRET: "CHANGE_ME_LONG_RANDOM"
      SOLO_JWT_ACCESS_EXP: "1800000"
      SOLO_JWT_REFRESH_EXP: "604800000"

      # ---- 流媒体 ZLMediaKit ----
      SOLO_MEDIA_HOOK_SECRET: "CHANGE_ME"   # 须与 ZLM config.ini [api].secret 一致
      SOLO_MEDIA_AUTO_PLAY: "true"
      SOLO_MEDIA_PUSH_AUTH: "true"
      SOLO_MEDIA_DEFAULT_ENABLED: "true"
      SOLO_MEDIA_SERVER_ID: "zlmediakit"
      SOLO_MEDIA_NAME: "默认节点"
      SOLO_MEDIA_HOST: "zlm"
      SOLO_MEDIA_HTTP_PORT: "10005"
      SOLO_MEDIA_SECRET: "CHANGE_ME"        # 须与 ZLM config.ini [api].secret 一致
      SOLO_MEDIA_STREAM_IP: ""
      SOLO_MEDIA_STREAM_HTTP_PORT: "0"
      SOLO_MEDIA_RTC_PORT: "0"

      # ---- 文件存储 S3（RustFS / MinIO / OSS ...）----
      SOLO_S3_ENDPOINT: "http://rustfs:9000"
      SOLO_S3_REGION: "us-east-1"
      SOLO_S3_ACCESS_KEY: "rustfsadmin"
      SOLO_S3_SECRET_KEY: "CHANGE_ME"
      SOLO_S3_BUCKET: "solo"
      SOLO_S3_PUBLIC_URL: ""
      SOLO_S3_PATH_STYLE: "true"

      # ---- 日志级别 ----
      SOLO_LOG_LEVEL: "info"
