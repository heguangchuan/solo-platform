spring:
  datasource:
    url: ${SOLO_DB_URL:jdbc:mysql://mysql:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SOLO_DB_USERNAME:changeit}
    password: ${SOLO_DB_PASSWORD:changeit}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SOLO_REDIS_HOST:redis}
      port: ${SOLO_REDIS_PORT:6379}
      password: ${SOLO_REDIS_PASSWORD:}
      database: ${SOLO_REDIS_DB:0}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SOLO_HTTP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

jwt:
  secret: ${SOLO_JWT_SECRET:please-change-this-to-a-long-random-secret}
  access-expiration: ${SOLO_JWT_ACCESS_EXP:1800000}
  refresh-expiration: ${SOLO_JWT_REFRESH_EXP:604800000}

s3:
  endpoint-override: ${SOLO_S3_ENDPOINT:http://rustfs:9000}
  region: ${SOLO_S3_REGION:us-east-1}
  access-key: ${SOLO_S3_ACCESS_KEY:rustfsadmin}
  secret-key: ${SOLO_S3_SECRET_KEY:rustfsadmin}
  bucket: ${SOLO_S3_BUCKET:solo}
  public-url: ${SOLO_S3_PUBLIC_URL:}
  path-style-access: ${SOLO_S3_PATH_STYLE:true}

logging:
  level:
    com.solo: ${SOLO_LOG_LEVEL:info}
    gov.nist: warn

gb28181:
  # SIP 监听 IP（容器内一般 0.0.0.0）；public-ip 为公网/NAT 可达地址，用于构造 Via/Contact 头
  ip: ${SOLO_SIP_IP:0.0.0.0}
  public-ip: ${SOLO_SIP_PUBLIC_IP:}
  port: ${SOLO_SIP_PORT:5060}
  id: ${SOLO_SIP_ID:60000000042000000028}
  domain: ${SOLO_SIP_DOMAIN:6000000004}
  # 设备注册鉴权密码；留空 = 开放模式（生产建议设置）
  password: ${SOLO_SIP_PASSWORD:}
  cascade:
    catalog-page-size: 3
    catalog-ack-timeout-ms: 3000
    catalog-page-interval-ms: 200
    # 本平台作为下级向上级 sendRtp 的本地发送端口段（需防火墙放行）
    send-rtp-port-start: ${SOLO_CASCADE_RTP_START:50000}
    send-rtp-port-end: ${SOLO_CASCADE_RTP_END:60000}


media:
  # hook 鉴权 secret，须与 ZLM config.ini 的 [api].secret 一致；生产务必覆盖
  hook-secret: ${SOLO_MEDIA_HOOK_SECRET:solo}
  auto-apply-play: ${SOLO_MEDIA_AUTO_PLAY:true}
  # 推流鉴权：生产务必开启
  push-auth-enabled: ${SOLO_MEDIA_PUSH_AUTH:true}
  default-server:
    enabled: ${SOLO_MEDIA_DEFAULT_ENABLED:true}
    server-id: ${SOLO_MEDIA_SERVER_ID:zlmediakit}
    name: ${SOLO_MEDIA_NAME:默认节点}
    host-ip: ${SOLO_MEDIA_HOST:zlm}
    http-port: ${SOLO_MEDIA_HTTP_PORT:8088}
    secret: ${SOLO_MEDIA_SECRET:solo}
    stream-ip: ${SOLO_MEDIA_STREAM_IP:}
    stream-http-port: ${SOLO_MEDIA_STREAM_HTTP_PORT:0}
    rtc-port: ${SOLO_MEDIA_RTC_PORT:0}


knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
