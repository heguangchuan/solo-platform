# project.ip 是平台本机地址；组件分开部署时，只改下面对应的地址
project:
  ip: 172.16.202.180
  # 数据库地址。本机部署用 localhost：pg_hba.conf 默认只放行 127.0.0.1，
  # 用本机网卡 IP 连接会被当作远程主机拒绝（no pg_hba.conf entry）。
  # 数据库独立部署时改成实际地址，并在 pg_hba.conf 放行本平台 IP。
  db: localhost
  redis: localhost
  s3: 172.16.202.200
  media: 172.16.202.200

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${project.db}:5432/solo_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 时间列是 timestamp(0) 不带时区，连接会话固定同一时区
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'

  data:
    redis:
      host: ${project.redis}
      port: 6379

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  access-expiration: 1800000
  refresh-expiration: 604800000

# region 是 AWS SDK 必填项；自托管 RustFS/MinIO/Ceph 一般用 us-east-1 + path-style
# 云厂商按实际 region 填
s3:
  endpoint-override: http://${project.s3}:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: solo
  public-url:
  path-style-access: true

gb28181:
  # 留空监听所有网卡
  ip: ${project.ip}
  # NAT/公网部署要填，用来写 Via/Contact，不然对端回包找不到路
  public-ip:
  port: 5060

  # 本平台 20 位国标编码，必填
  id: 60000000042000000028
  # 一般是 10 位行政区划编码
  domain: 6000000004

  # 留空就不验 Digest，只能在隔离测试环境这么玩
  password:


  cascade:

    # 单包别贪大，超过 8 有些上级会拒收；一般就用 1/2/4/8
    catalog-page-size: 3

    # 每片先等 ACK；公网/老设备可调到 5-8s
    catalog-ack-timeout-ms: 3000

    # 只有等 ACK 超时/出错才按这个间隔继续，正常收到 ACK 不走这里
    catalog-page-interval-ms: 200

    # 向上级发流的本地端口段，避开收流端口并放通防火墙
    send-rtp-port-start: 50000
    send-rtp-port-end: 60000



media:
  # 必须和 ZLM config.ini 的 [api].secret 对上；不配的话 hook 全会被拒
  hook-secret: solo

  # 带有效 wt 访问不存在的国标流时，自动补发 INVITE
  auto-apply-play: true

  # 关闭后任何客户端都能推流，生产环境别开这个口子
  push-auth-enabled: true

  # 播放鉴权没有关闭开关；secret 留空用 jwt.secret，多实例要配成一样的
  play-auth:
    secret: ${MEDIA_PLAY_AUTH_SECRET:}
    token-ttl-seconds: 7200

  # 这里只管观看记录，不影响播放鉴权
  view-record:
    enabled: true
    # 观看中超过这么多分钟还没闭合，就兜底关掉
    sweep-stale-minutes: 240

  default-server:
    enabled: true
    # 必须和 ZLM config.ini 的 [general].mediaServerId 完全一致，不然 hook 找不到节点
    server-id: zlmediakit-local
    name: 默认节点
    host-ip: ${project.media}
    http-port: 8088
    secret: solo
    # 对外播放和 SDP c= 都用它，留空跟 host-ip 走；必须是对端能到的地址
    stream-ip:
    # 0 表示跟 http-port 走
    stream-http-port: 0
    # 取 ZLM [rtc].port，网页喊话要用，防火墙放行 UDP
    rtc-port: 8000
