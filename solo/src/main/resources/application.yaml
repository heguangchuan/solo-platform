spring:
  profiles:
    active: pg
  application:
    name: solo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true

# 只有直连地址命中可信代理才信 X-Forwarded-For/X-Real-IP。
# 直连留空；nginx 同机填 127.0.0.1,::1，异机填代理实际网段。
openapi:
  trusted-proxies: 

logging:
  level:
    com.solo: info
    gov.nist: warn
