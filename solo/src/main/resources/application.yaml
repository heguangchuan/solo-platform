spring:
  application:
    name: solo

  datasource:
    url: jdbc:mysql://localhost:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  # access token 30 分钟
  access-expiration: 1800000
  # refresh token 7 天
  refresh-expiration: 604800000

# 文件存储（仅 MinIO）
file:
  minio:
    endpoint: http://localhost:29000
    access-key: minio
    secret-key: minio213
    bucket: solo
    # 可选：对外访问域名（CDN/反代）。留空则使用 endpoint 拼接 URL
    public-url:

logging:
  level:
    com.solo: info

# GB/T 28181 国标平台配置
gb28181:
  # 是否启用国标服务
  enabled: true
  # SIP 监听 IP，留空表示监听所有网卡；公网/多网卡部署时建议填设备能访问到的 IP
  ip: 192.168.1.3
  # SIP 监听端口
  port: 5060
  # 本平台 SIP ID（20 位，前 10 位行政区划编码 + 后 10 位平台编号）
  id: 34020000002000000001
  # 本平台 SIP 域（一般是行政区划编码 + 4 位 0000）
  domain: 3402000000
  # 设备注册鉴权密码
  password: 12345678
  # 设备注册有效期（秒）
  register-expires: 3600
  # 心跳超时倍数：超过 multiplier × Keepalive 周期未收到心跳即判定离线
  keepalive-timeout-multiplier: 3
