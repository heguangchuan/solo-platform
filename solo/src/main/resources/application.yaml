spring:
  application:
    name: solo

  datasource:
    url: jdbc:mysql://localhost:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  # access token 30 分钟
  access-expiration: 1800000
  # refresh token 7 天
  refresh-expiration: 604800000

# 文件存储（仅 MinIO）
file:
  minio:
    endpoint: http://localhost:29000
    access-key: minio
    secret-key: minio213
    bucket: solo
    # 可选：对外访问域名（CDN/反代）。留空则使用 endpoint 拼接 URL
    public-url:

logging:
  level:
    com.solo: info

# ========== GB28181 国标配置 ==========

# [国标核心配置] SIP 服务配置
sip:
  # 本机监听 IP，多张网卡用逗号分隔，不明白请填 0.0.0.0
  ip: 0.0.0.0
  # GB28181 服务监听端口
  port: 15060
  # 国标域 ID，采用 ID 统一编码前十位
  domain: 6000000004
  # 服务器 ID
  id: 60000000042000000028
  # 默认设备认证密码，移除则不进行校验
  password: 123456
  # 是否存储 alarm 信息
  alarm: true

# [流媒体服务配置] ZLMediaKit 配置
media:
  id: zlmediakit-local
  # ZLMediaKit 服务器 IP（必须修改）
  ip: 192.168.1.100
  # ZLMediaKit HTTP 端口
  http-port: 10005
  # ZLMediaKit 访问 WVP 所用 IP，不同服务器必须配置
  hook-ip: 192.168.1.3
  # ZLMediaKit API 密钥
  secret: DHrrFblswkEIPR7t30xjsJELKjMsKEQf
  # RTP 配置
  rtp:
    # 是否启用多端口模式，开启后兼容性更好
    enable: true
    # 媒体流传输端口范围
    port-range: 30000,35000
    # 国标级联发送端口范围
    send-port-range: 30000,35000

# 用户业务配置
user-settings:
  # 点播/录像回放等待超时时间（毫秒）
  play-timeout: 180000
  # 自动点播，有人观看才拉流
  auto-apply-play: true
  # 推流直播是否录制
  record-push-live: false
  # 国标是否录制
  record-sip: true
  # 国标点播按需拉流，true：有人观看拉流，无人释放
  stream-on-demand: true

# 录像存储配置
ts:
  # 是否开启录制
  enabled: true
  base:
    # 录像文件存储目录
    directory: ./record
