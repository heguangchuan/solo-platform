spring:
  application:
    name: solo

  datasource:
    url: jdbc:mysql://localhost:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  # access token 30 分钟
  access-expiration: 1800000
  # refresh token 7 天
  refresh-expiration: 604800000

# Web 终端配置
terminal:
  connect-timeout-ms: 10000
  idle-timeout-ms: 600000
  input-frame-max-bytes: 2048
  default-cols: 80
  default-rows: 24
  output-buffer-size: 8192

# 文件存储（仅 MinIO）
file:
  minio:
    endpoint: http://localhost:29000
    access-key: minio
    secret-key: minio213
    bucket: solo
    # 可选：对外访问域名（CDN/反代）。留空则使用 endpoint 拼接 URL
    public-url:

logging:
  level:
    com.solo: info
