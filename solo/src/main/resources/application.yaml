      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  access-expiration: 1800000
  refresh-expiration: 604800000

minio:
  endpoint: http://localhost:9000
  access-key: minio
  secret-key: minio213
  bucket: solo
  public-url:

logging:
  level:
    com.solo: info
    # JAIN-SIP 协议栈内部日志（含收发报文摘要）默认压到 warn，避免刷屏影响排查；
    # 调试设备方言 / SIP 交互时临时调成 info 或 debug。另见 gb28181.sip.sipLog（控制是否打完整报文体）。
    gov.nist: warn

# GB/T 28181 国标平台配置
gb28181: # 是否启用国标服务
  enabled: true
  # SIP 监听 IP，留空表示监听所有网卡；公网/多网卡部署时建议填设备能访问到的 IP
  ip: ${project.ip}
  # SIP 监听端口
  port: 15060
  # 本平台 SIP ID（20 位，前 10 位行政区划编码 + 后 10 位平台编号）
  id: 60000000042000000028
  # 本平台 SIP 域（一般是行政区划编码 + 4 位 0000）
  domain: 6000000004
  # 设备注册鉴权密码。留空 = 开放模式（不挑战、不校验）。
  # 留空时本平台对所有 REGISTER 直接回 200 OK；不推荐公网/多租户环境使用。
  # 设置后：设备首次 REGISTER → 平台发 401 + Digest challenge（带 realm）；设备二次 REGISTER 带 Authorization → 平台**不校验**摘要，直接 200 OK。
  # 详见 gb28181.md ADR-022
  password: 123456
  # 设备注册有效期（秒）
  register-expires: 3600
  # 心跳超时倍数：超过 multiplier × Keepalive 周期未收到心跳即判定离线
  keepalive-timeout-multiplier: 3

  # 默认资源目录分组：通道注册/导入/新增未指定分组时统一挂到此分组下
  default-group:
    id: -1
    group-id: 60000000042160000001
    name: ${project.ip}

  # 级联下级侧：本平台作为下级向上级推送目录/通道时的分片节奏
  cascade:
    # 每片 Catalog Response 中 <Item> 上限
    catalog-page-size: 3
    # 相邻两片 MESSAGE 间的睡眠（毫秒），避免瞬时刷屏
    catalog-page-interval-ms: 50
    # 上级点播 sendRtp 本地发送端口段（需与 media rtp 收流端口段错开、防火墙放行）
    send-rtp-port-start: 50000
    send-rtp-port-end: 60000
    # 上级点播回 200 OK 后等待 ACK 的超时（毫秒），超时释放并 BYE 上级
    send-ack-timeout-ms: 60000

  # 目录分片累积调优（10w+ 通道重写后参数）
  catalog:
    # 静默超时：连续多少毫秒无新 item → 视为设备发完，partial finalize
    # idle-finalize-ms: 120000
    # 强制收尾：完全多少毫秒无任何响应 → sweep 强收
    # expire-ms: 600000
    # 滚动缓冲阈值：缓冲达到该条数立即触发批量入库
    # flush-threshold: 1000
    # 时间触发 flush 间隔（毫秒）：距上次 flush 超过此值且缓冲非空强制 flush
    # flush-interval-ms: 2000
    # 单批入库 SQL 行数（MySQL max_allowed_packet 限制）
    # batch-size: 500
    # 丢包容忍：累计收到 >= sumNum * 该比例才清"已不存在通道"
    # completeness-threshold: 0.95
  # 目录同步落库专用线程池（独立于业务池，避免阻塞 SIP 分发）
  catalog-sync-pool:
    # core-pool-size: 20
    # max-pool-size: 50
    # queue-capacity: 5000

# 流媒体（ZLMediaKit）相关配置
media:
  hook-secret: DHrrFblswkEIPR7t30xjsJELKjMsKEQf
  default-server:
    enabled: true
    server-id: zlmediakit-local
    name: 默认节点
    host-ip: 192.168.1.25
    http-port: 10005
    secret: DHrrFblswkEIPR7t30xjsJELKjMsKEQf
    rtp-port-start: 30000
    rtp-port-end: 35000
    # 对外播放使用的 IP（HTTP-FLV / WS-FLV / HLS / WebRTC），留空则同 host-ip
    stream-ip:
  # 单次点播/回放 INVITE 超时（秒），超时未收到 on_stream_changed 视为失败并回收
  invite-timeout-seconds: 30
  record-info-timeout-seconds: 30
  # PLAYBACK INVITE 等待流就绪超时（秒）
  playback-timeout-seconds: 30
  # SSRC 池：国标 SSRC 第 4-8 位取自 SIP 域中段，序号循环 0001-9999
  ssrc-domain-start: 0
  # 自动点播：流不存在时自动向设备发 INVITE 发起点播（需 RTP 多端口模式启用）
  auto-apply-play: true
  # 按需拉流：无人观看时自动关闭流释放资源；false 则拉起后一直保持推送
  stream-on-demand: true
  # 推流鉴权是否启用
  push-auth-enabled: true
