spring:
  application:
    name: solo

  datasource:
    url: jdbc:mysql://localhost:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:sql/init.sql
#      continue-on-error: false

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.solo.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGVhc2UtdXNlLWEtbG9uZy1zZWNyZXQ=
  expiration: 86400000

# 文件存储：local（默认）/ minio
# 切换到 minio：file.storage.type=minio + 配置 file.minio.* + 引入 io.minio:minio 依赖
file:
  storage:
    type: local
  local:
    # 本地根目录，绝对或相对路径均可（相对路径相对于应用启动目录）
    root: ./uploads
    # 对外访问前缀，需要与 WebMvcConfig 静态资源映射一致；同时被前端拼成 URL 前缀
    public-prefix: /uploads
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: solo
    # 可选：对外访问域名（CDN/反代）。留空则使用 endpoint 拼接 URL
    public-url:

logging:
  level:
    com.solo: debug
