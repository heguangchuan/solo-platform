# ============================================================
#  部署地址统一维护
#  project.ip 是平台本机地址（SIP 监听用）；各组件默认跟随它，
#  组件分散部署时只改对应那一行，下面的连接配置不用动。
# ============================================================
project:
  ip: 172.16.202.180
  # 数据库地址。本机部署用 localhost：pg_hba.conf 默认只放行 127.0.0.1，
  # 用本机网卡 IP 连接会被当作远程主机拒绝（no pg_hba.conf entry）。
  # 数据库独立部署时改成实际地址，并在 pg_hba.conf 放行本平台 IP。
  db: localhost
  # Redis 地址
  redis: localhost
  # 对象存储（S3 兼容）地址
  s3: 172.16.202.200
  # 流媒体 ZLMediaKit 地址
  media: 172.16.202.200

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${project.db}:3306/solo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${project.redis}
      port: 6379

jwt:
  secret: c2VjcmV0LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1wbGFoZXUtdXNlLTEtbG9uZy1zZWNyZXQ=
  access-expiration: 1800000
  refresh-expiration: 604800000

# ============================================================
#  文件存储（S3 兼容：RustFS / MinIO / 阿里云 OSS / 腾讯云 COS / 华为云 OBS / Ceph RGW / AWS S3）
#  ─────────────────────────────────
#  endpoint-override 指向 S3 服务的访问入口（默认使用自托管 RustFS）。region 字段 AWS SDK 必填：
#    - RustFS / MinIO / Ceph：随便写，推荐 us-east-1
#    - 阿里云 OSS：用所在 region（cn-hangzhou 等）
#    - AWS S3：用真实 region
#  path-style-access 默认 true——RustFS / MinIO / Ceph / 自托管必须 path-style；阿里云/腾讯云
#  /华为云两种都支持；AWS S3 也能跑 path-style
# ============================================================
s3:
  endpoint-override: http://${project.s3}:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: solo
  public-url:
  path-style-access: true

# ============================================================
#  GB/T 28181 国标平台配置
#  原则：可能需要部署改的字段都保留，值由代码默认/部署覆盖；
#  只有"代码自动算"的（线程池）才不留。
# ============================================================
gb28181:
  # SIP 监听 IP；无代码默认，必填
  ip: ${project.ip}
  # SIP 公网 IP；NAT/公网部署时必填，用于构造 Via/Contact 头，让下级/设备能正常回包
  public-ip:
  # SIP 监听端口（与代码默认 5060 一致，标准国标端口）
  port: 5060

  # 本平台 SIP ID（20 位：行政区划 10 位 + 平台编号 10 位），无代码默认
  id: 60000000042000000028
  # 本平台 SIP 域（一般是行政区划 + 4 位 0000），无代码默认
  domain: 6000000004

  # 设备注册鉴权密码。无代码默认；留空 = 开放模式（详见 gb28181.md ADR-022）
  password:


  # 级联下级侧：本平台作为下级向上级推送目录/通道时的分片节奏与超时
  cascade:

    # Catalog 响应每片 XML 中装多少个 Item。1/2/4/8 是 ADR-027 收敛出的单包安全档位，
    # 超过 8 某些品牌上级会拒收/拆包失败。保守起步 3，遇问题调成 1 或 2。
    catalog-page-size: 3

    # 等上级回 200 OK 的超时（毫秒）。到点没收 ACK 就走 catalog-page-interval-ms 兜底节奏继续。
    # 内网主流平台 3s 够用；公网/老国标可上调到 5-8s。
    catalog-ack-timeout-ms: 3000

    # ACK 驱动改造（ADR-027）后，本字段退化为「ACK 超时/出错时的 fallback 兜底间隔」，
    # 200ms 防止对端长时间无响应时 sender 线程被占用。ACK 正常时不走这条。
    catalog-page-interval-ms: 200

    # 上级点播 sendRtp 本地发送端口段（需与 media rtp 收流端口段错开、防火墙放行）
    send-rtp-port-start: 50000
    send-rtp-port-end: 60000



# ============================================================
#  流媒体（ZLMediaKit）相关配置
#  原则同 gb28181：可能需要部署改的字段都保留。
# ============================================================
media:
  # ZLM hook 回调的鉴权 secret（须与 ZLM config.ini 中 [api].secret 一致）；
  # solo 收到 hook 后会校验请求中的 secret 字段。未配置时所有 hook 都会被拒，启动期日志会告警
  hook-secret: solo

  # 自动点播：流不存在时自动向设备发 INVITE 发起点播（需 RTP 多端口模式启用）。
  # 开启后用户通过播放 URL 访问不存在流时自动补一次 INVITE；关闭则需先点"播放"按钮
  auto-apply-play: true

  # 推流鉴权是否启用。true=on_publish 时校验 URL 里的 ?token= 参数是否命中 stream_push_client；
  # false=不做任何校验（生产环境务必开启）
  push-auth-enabled: true

  # 观看记录：播放地址带签名令牌 wt，on_play 凭令牌识别观看者落库，on_flow_report 闭合
  view-record:
    # 关闭后不签发令牌，hook 侧识别不到观看者，只跳过记录不拦播放
    enabled: true
    # 令牌有效期（秒），只要求播放发起时有效，长时观看不受到期影响
    token-ttl-seconds: 7200
    # 定时清扫阈值（分钟）：超过该时长仍处于观看中的记录按兜底闭合
    sweep-stale-minutes: 240

  # 启动时若 gb_media_server 表为空则自动 upsert 一个默认 ZLM 节点
  default-server:
    # 是否在启动时自动 upsert（测试环境可关掉,生产必开）
    enabled: true
    # ZLM 节点唯一标识，必须与 ZLM config.ini 中 [general].mediaServerId 完全一致
    server-id: zlmediakit-local
    # 节点显示名（仅用于管理面展示）
    name: 默认节点
    # ZLM 管理面 IP（用于 REST API 调用）
    host-ip: ${project.media}
    # ZLM HTTP API 端口
    http-port: 8088
    # ZLM API secret（与 hook-secret 一般相同，但也允许单节点独立配置）
    secret: solo
    # 对外播放使用的 IP（HTTP-FLV / WS-FLV / HLS / WebRTC）。留空则同 host-ip。
    # 勿与 host-ip 混用：SDP c= 也从此取，需对端可达
    stream-ip:
    # 对外 HTTP/WS-FLV/HLS 端口；0 表示与 http-port 一致
    stream-http-port: 0
    # 对外 WebRTC 端口，取 ZLM [rtc].port；网页喊话推流依赖，防火墙放行 UDP
    rtc-port: 8000
